<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>GéoClassement</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: rgba(255,255,255,0.08);
    --text: #f1f5f9;
    --muted: #64748b;
    --accent: #3b82f6;
    --gold: #f59e0b;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ---- HEADER ---- */
  .app-title {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .app-title span { color: var(--text); }

  /* ---- MODE TABS ---- */
  .mode-tabs {
    display: flex;
    background: var(--card);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 24px;
    gap: 4px;
  }
  .mode-tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
    text-align: center;
    line-height: 1.2;
  }
  .mode-tab.active {
    background: var(--accent);
    color: white;
  }
  .mode-tab .tab-icon { display: block; font-size: 1.1rem; margin-bottom: 2px; }

  /* ---- SECTION LABEL ---- */
  .section-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ---- CAT SECTION (modes classique + libre) ---- */
  .cat-section { margin-bottom: 28px; }

  .cat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px 20px;
    text-align: center;
    margin-bottom: 12px;
    transition: all .3s;
  }
  .cat-card.empty .cat-icon { font-size: 2.8rem; opacity: .25; }
  .cat-card.filled .cat-icon { font-size: 2.8rem; }
  .cat-card.filled .cat-name {
    font-size: 1.5rem;
    font-weight: 800;
    margin-top: 10px;
    line-height: 1.2;
  }
  .cat-card.empty .placeholder {
    font-size: 1rem;
    color: var(--muted);
    margin-top: 10px;
  }
  .cat-card.filled .cat-desc {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ---- BTN DRAW / ACTIONS ---- */
  .btn-draw {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .15s, transform .1s;
  }
  .btn-draw:active { transform: scale(0.97); opacity: .85; }
  .btn-draw:disabled {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    cursor: not-allowed;
    transform: none;
    opacity: 1;
  }

  .btn-secondary {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: transparent;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: border-color .15s, color .15s;
    margin-top: 8px;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--text); }
  .btn-secondary:active { opacity: .7; }

  .classique-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .classique-counter {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .classique-counter span { color: var(--gold); font-weight: 700; }

  /* ---- MODE LIBRE : grille catégories ---- */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  #libre-src { margin-bottom: 18px; min-height: 1em; text-align: center; }

  /* ---- SOURCES (discrètes) ---- */
  .src-line {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.4;
  }
  .src-line a { color: inherit; text-decoration: underline dotted; text-underline-offset: 2px; }
  .src-line a:hover { color: var(--text); }
  .modal-row-label .src-line { margin-top: 2px; }
  .cat-grid-item {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .cat-grid-item:active { opacity: .75; }
  .cat-grid-item.selected {
    border-color: var(--gold);
    background: rgba(245,158,11,.08);
  }
  .cat-grid-item .gi-icon { font-size: 1.6rem; line-height: 1; }
  .cat-grid-item .gi-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.3;
  }
  .cat-grid-item.selected .gi-label { color: var(--gold); }

  /* ---- MODE MULTI ---- */
  .multi-section { margin-bottom: 28px; }

  .multi-picker {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .multi-picker-label {
    flex: 1;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .multi-picker-label strong { color: var(--text); display: block; font-size: 1.05rem; margin-bottom: 2px; }
  .multi-stepper {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .stepper-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.1);
    color: var(--text);
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background .15s;
  }
  .stepper-btn:hover { background: rgba(255,255,255,.18); }
  .stepper-btn:disabled { opacity: .3; cursor: not-allowed; }
  .stepper-val {
    font-size: 2rem;
    font-weight: 800;
    color: var(--gold);
    min-width: 32px;
    text-align: center;
  }

  .multi-cats-drawn {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .multi-cat-chip {
    background: rgba(245,158,11,.12);
    border: 1px solid rgba(245,158,11,.35);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ---- SÉPARATEUR ---- */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  /* ---- RECHERCHE ---- */
  .search-section {}
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 14px 14px 14px 42px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  /* ---- RÉSULTATS ---- */
  .results { display: flex; flex-direction: column; gap: 8px; }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .result-card:active { border-color: var(--accent); }

  .result-flag { font-size: 2rem; line-height: 1; flex-shrink: 0; }

  .result-body { flex: 1; min-width: 0; }
  .result-name { font-weight: 700; font-size: 1rem; }
  .result-cat { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

  .result-value {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--gold);
    text-align: right;
    flex-shrink: 0;
  }

  /* résultat multi: liste de valeurs */
  .result-multi {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 6px;
  }
  .result-multi-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
  }
  .result-multi-label { color: var(--muted); }
  .result-multi-val { color: var(--gold); font-weight: 700; }

  /* État sans catégorie */
  .no-cat-hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 30px 0;
  }

  /* Aucun résultat */
  .no-result {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 0.9rem;
  }

  /* ---- MODAL détail ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1e293b;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 48px;
    width: 100%;
    max-width: 480px;
    animation: slideUp .25s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } }
  .modal-flag { font-size: 4rem; text-align: center; line-height: 1; margin-bottom: 8px; }
  .modal-name { font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 20px; }
  .modal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row-label { font-size: 0.9rem; color: var(--muted); padding-right: 10px; }
  .modal-row-value { font-weight: 700; font-size: 1rem; }
  .modal-row-value.highlight { color: var(--gold); font-size: 1.2rem; }
  .modal-close {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="app-title">🌍 <span>GéoClassement</span></div>

<!-- MODE TABS -->
<div class="mode-tabs">
  <button class="mode-tab active" id="tab-libre" onclick="setMode('libre')">
    <span class="tab-icon">🎯</span>Mode libre
  </button>
  <button class="mode-tab" id="tab-classique" onclick="setMode('classique')">
    <span class="tab-icon">🎲</span>Classique
  </button>
  <button class="mode-tab" id="tab-multi" onclick="setMode('multi')">
    <span class="tab-icon">🃏</span>Multi-cat.
  </button>
</div>

<!-- ===== MODE LIBRE ===== -->
<div id="section-libre">
  <div class="section-label">Choisir une catégorie</div>
  <div class="cat-grid" id="cat-grid"></div>
  <div class="src-line" id="libre-src"></div>
</div>

<!-- ===== MODE CLASSIQUE ===== -->
<div id="section-classique" style="display:none">
  <div class="cat-section">
    <div id="classique-setup">
      <div class="section-label">Nombre de manches</div>
      <div class="multi-picker">
        <div class="multi-picker-label">
          <strong id="rounds-label">15 manches</strong>
          une catégorie différente à chaque manche
        </div>
        <div class="multi-stepper">
          <button class="stepper-btn" id="btn-rounds-minus" onclick="changeRounds(-1)">−</button>
          <div class="stepper-val" id="rounds-val">15</div>
          <button class="stepper-btn" id="btn-rounds-plus" onclick="changeRounds(1)">+</button>
        </div>
      </div>
    </div>
    <div class="classique-meta" id="classique-meta" style="display:none">
      <div class="section-label" style="margin-bottom:0">Catégorie en cours</div>
      <div class="classique-counter">Manche <span id="classique-used">0</span>/<span id="classique-total">15</span></div>
    </div>
    <div class="cat-card empty" id="cat-card-classique">
      <div class="cat-icon">🎲</div>
      <div class="placeholder">Tire une catégorie pour commencer</div>
    </div>
    <button class="btn-draw" id="btn-draw-classique">🎲 Tirer une catégorie</button>
    <button class="btn-secondary" id="btn-reset-classique">↺ Nouvelle partie</button>
  </div>
</div>

<!-- ===== MODE MULTI ===== -->
<div id="section-multi" style="display:none">
  <div class="multi-section">
    <div class="section-label">Nombre de catégories à tirer</div>
    <div class="multi-picker">
      <div class="multi-picker-label">
        <strong id="multi-x-label">3 catégories</strong>
        seront tirées au sort pour la partie
      </div>
      <div class="multi-stepper">
        <button class="stepper-btn" id="btn-minus" onclick="changeMultiX(-1)">−</button>
        <div class="stepper-val" id="multi-x-val">3</div>
        <button class="stepper-btn" id="btn-plus" onclick="changeMultiX(1)">+</button>
      </div>
    </div>
    <div id="multi-cats-drawn" class="multi-cats-drawn" style="display:none"></div>
    <button class="btn-draw" id="btn-draw-multi">🃏 Tirer les catégories</button>
    <button class="btn-secondary" id="btn-reset-multi" style="display:none">↺ Nouvelle partie</button>
  </div>
</div>

<div class="divider"></div>

<!-- SECTION RECHERCHE (commune à tous les modes) -->
<div class="search-section">
  <div class="section-label">Rechercher un pays</div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search-input" type="text" placeholder="Ex : France, Japon, Brésil…" autocomplete="off">
  </div>
  <div class="results" id="results"></div>
</div>

<!-- MODAL détail pays -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <div class="modal-flag" id="m-flag"></div>
    <div class="modal-name" id="m-name"></div>
    <div id="m-rows"></div>
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">Fermer</button>
  </div>
</div>

  {key:"alpha",   label:"Taux d'alphabétisation",   unit:"%",          icon:"📚", fmt:v=>v+"%", note:"Adultes. 99 % par convention pour les pays sans enquête (Europe de l'Ouest, Amérique du Nord, Japon…)"},
  {key:"nobel",   label:"Prix Nobel",                unit:"lauréats",   icon:"🏆", fmt:v=>v+" lauréat"+(v>1?"s":""), note:"Lauréats rattachés au pays par le comité Nobel (nationalité ou naissance)"},
  {key:"front",  label:"Pays frontaliers",      unit:"voisins",  icon:"🧭", fmt:v=>v+" voisin"+(v>1?"s":""), note:"Outre-mer compris (ex. la France touche le Brésil par la Guyane)"},

  {key:"dist",    label:"Distance à Paris",          unit:"km",         icon:"📍", fmt:v=>v.toLocaleString("fr-FR")+" km", note:"De capitale à capitale, à vol d'oiseau"},
  {key:"alcool",  label:"Consommation d'alcool",     unit:"L/an",       icon:"🍷", fmt:v=>v<0.1?"< 0,1 L/hab/an":v.toLocaleString("fr-FR",{minimumFractionDigits:1})+" L/hab/an", note:"Litres d'alcool pur par adulte (15 ans et +)"},
  {key:"tmax",    label:"Record de chaleur",         unit:"°C",         icon:"🌡️", fmt:v=>v.toLocaleString("fr-FR",{minimumFractionDigits:1})+" °C", note:"Température la plus haute jamais relevée dans le pays"},
  {key:"armee",   label:"Budget militaire",          unit:"M$",         icon:"🪖", fmt:v=>v===0?"0 $ (pas d'armée)":v>=1000?(v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" Md$":v.toLocaleString("fr-FR")+" M$", note:"Dépenses militaires annuelles"},
  {key:"rugby",   label:"Classement mondial rugby",  unit:"rang",       icon:"🏉", fmt:v=>"#"+v, nullLabel:"Non classé", note:"Plus le rang est bas, meilleure est l'équipe. Royaume-Uni = Angleterre"},
  {key:"cdm",     label:"Participations Coupe du monde", unit:"éditions", icon:"🏟️", fmt:v=>v+" participation"+(v>1?"s":""), note:"Football masculin. Royaume-Uni = Angleterre"},
  {key:"prison",  label:"Taux d'incarcération",      unit:"/100 000",   icon:"⛓️", fmt:v=>v+" détenus / 100 000 hab.", note:"Nombre de détenus pour 100 000 habitants"},
  {key:"viande",  label:"Consommation de viande",    unit:"kg/an",      icon:"🥩", fmt:v=>v.toLocaleString("fr-FR",{maximumFractionDigits:1})+" kg/hab/an", note:"Viande disponible par habitant"}

/* ========== SOURCES DES DONNÉES ========== */
const SOURCES = {
  pop:     {label:"Banque mondiale", url:"https://data.worldbank.org/indicator/SP.POP.TOTL", date:"2025"},
  pib:     {label:"Banque mondiale", url:"https://data.worldbank.org/indicator/NY.GDP.MKTP.CD", date:"2025"},
  fifa:    {label:"FIFA", url:"https://inside.fifa.com/fifa-world-ranking/men", date:"classement du 20 juil. 2026"},
  alt:     {label:"CIA World Factbook (archive)", url:"https://github.com/factbook/factbook.json", date:"dernière édition, 2026"},
  cote:    {label:"CIA World Factbook (archive)", url:"https://github.com/factbook/factbook.json", date:"dernière édition, 2026"},

  tmax:    {label:"Wikipédia – List of weather records", url:"https://en.wikipedia.org/wiki/List_of_weather_records", date:"consulté en oct. 2026"},

CATEGORIES.forEach(c => { c.src = SOURCES[c.key]; });

function srcHTML(cat){
  const s = cat && cat.src;
  if(!s) return "";
  const name = s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>` : s.label;
  return `Source : ${name} · ${s.date}`;
}

/* ========== ÉTAT ========== */
let currentMode = 'libre';

// Mode libre
let libereCat = null;

// Mode classique
let classiqueCat = null;
let classiqueUsed = new Set();
let classiqueRounds = 15; // nombre de manches choisi en début de partie

// Mode multi
let multiX = 3;
let multiCats = []; // catégories tirées pour la partie

/* ========== UTILITAIRES ========== */
function show(cat, v){
  if(v === null || v === undefined) return cat.nullLabel || "Donnée indisponible";
  return cat.fmt(v);
}
function flag(iso){
  return iso.toUpperCase().replace(/./g, c => String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65));
}

function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[-'\s]/g, "");
}

/* ========== CHANGEMENT DE MODE ========== */
function setMode(mode){
  currentMode = mode;
  ['libre','classique','multi'].forEach(m => {
    document.getElementById('tab-'+m).classList.toggle('active', m === mode);
    document.getElementById('section-'+m).style.display = m === mode ? '' : 'none';
  });
  // Vider la recherche
  document.getElementById('search-input').value = '';
  renderResults('');
}

/* ========== MODE LIBRE ========== */
function buildCatGrid(){
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const item = document.createElement('div');
    item.className = 'cat-grid-item' + (libereCat && libereCat.key === cat.key ? ' selected' : '');
    item.innerHTML = `<div class="gi-icon">${cat.icon}</div><div class="gi-label">${cat.label}</div>`;
    item.addEventListener('click', () => {
      libereCat = cat;
      document.querySelectorAll('.cat-grid-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      document.getElementById('libre-src').innerHTML = srcHTML(cat);
      renderResults(document.getElementById('search-input').value.trim());
    });
    grid.appendChild(item);
  });
}

/* ========== MODE CLASSIQUE ========== */
function changeRounds(delta){
  classiqueRounds = Math.max(1, Math.min(CATEGORIES.length, classiqueRounds + delta));
  document.getElementById('rounds-val').textContent = classiqueRounds;
  document.getElementById('rounds-label').textContent = classiqueRounds + ' manche' + (classiqueRounds > 1 ? 's' : '');
  document.getElementById('btn-rounds-minus').disabled = classiqueRounds <= 1;
  document.getElementById('btn-rounds-plus').disabled = classiqueRounds >= CATEGORIES.length;
  document.getElementById('classique-total').textContent = classiqueRounds;
}

document.getElementById('btn-draw-classique').addEventListener('click', () => {
  const pool = CATEGORIES.filter(c => !classiqueUsed.has(c.key));
  if(pool.length === 0 || classiqueUsed.size >= classiqueRounds) return;

  classiqueCat = pool[Math.floor(Math.random() * pool.length)];
  classiqueUsed.add(classiqueCat.key);
  updateClassiqueUI();
  renderResults(document.getElementById('search-input').value.trim());
});

document.getElementById('btn-reset-classique').addEventListener('click', () => {
  classiqueCat = null;
  classiqueUsed = new Set();
  updateClassiqueUI();
  renderResults(document.getElementById('search-input').value.trim());
});

function updateClassiqueUI(){
  const card = document.getElementById('cat-card-classique');
  const btn = document.getElementById('btn-draw-classique');
  const counter = document.getElementById('classique-used');
  counter.textContent = classiqueUsed.size;
  const started = classiqueUsed.size > 0;
  document.getElementById('classique-setup').style.display = started ? 'none' : '';
  document.getElementById('classique-meta').style.display = started ? '' : 'none';
  document.getElementById('btn-reset-classique').style.display = started ? '' : 'none';
  const catHTML = c => `
      <div class="cat-icon">${c.icon}</div>
      <div class="cat-name">${c.label}</div>
      <div class="cat-desc">${c.note || "Classe les pays du plus petit au plus grand"}</div>
      <div class="src-line">${srcHTML(c)}</div>
    `;

  if(!classiqueCat){
    card.className = 'cat-card empty';
    card.innerHTML = `<div class="cat-icon">🎲</div><div class="placeholder">Tire une catégorie pour commencer</div>`;
    btn.disabled = false;
    btn.textContent = '🎲 Commencer la partie';
  } else if(classiqueUsed.size >= classiqueRounds){
    card.className = 'cat-card filled';
    card.innerHTML = catHTML(classiqueCat);
    btn.disabled = true;
    btn.textContent = '🏁 Partie terminée';
  } else {
    card.className = 'cat-card filled';
    card.innerHTML = catHTML(classiqueCat);
    btn.disabled = false;
    btn.textContent = '🎲 Manche suivante';
  }
}

/* ========== MODE MULTI ========== */
function changeMultiX(delta){
  multiX = Math.max(1, Math.min(CATEGORIES.length, multiX + delta));
  document.getElementById('multi-x-val').textContent = multiX;
  document.getElementById('multi-x-label').textContent = multiX + ' catégorie' + (multiX > 1 ? 's' : '');
  document.getElementById('btn-minus').disabled = multiX <= 1;
  document.getElementById('btn-plus').disabled = multiX >= CATEGORIES.length;
}

document.getElementById('btn-draw-multi').addEventListener('click', () => {
  if(multiCats.length > 0){
    // Nouvelle partie — reset
    multiCats = [];
  }
  // Tirage sans remise
  const pool = [...CATEGORIES];
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  multiCats = pool.slice(0, multiX);
  updateMultiUI();
  renderResults(document.getElementById('search-input').value.trim());
});

document.getElementById('btn-reset-multi').addEventListener('click', () => {
  multiCats = [];
  updateMultiUI();
  renderResults(document.getElementById('search-input').value.trim());
});

function updateMultiUI(){
  const drawnEl = document.getElementById('multi-cats-drawn');
  const btnDraw = document.getElementById('btn-draw-multi');
  const btnReset = document.getElementById('btn-reset-multi');
  const picker = document.querySelector('.multi-picker');

  if(multiCats.length === 0){
    drawnEl.style.display = 'none';
    drawnEl.innerHTML = '';
    btnDraw.textContent = '🃏 Tirer les catégories';
    btnReset.style.display = 'none';
    picker.style.display = '';
  } else {
    drawnEl.style.display = 'flex';
    drawnEl.innerHTML = multiCats.map(c =>
      `<div class="multi-cat-chip">${c.icon} ${c.label}</div>`
    ).join('');
    btnDraw.textContent = '🎲 Nouveau tirage';
    btnReset.style.display = '';
    picker.style.display = 'none';
  }
}

/* ========== ACTIVE CATS (selon le mode) ========== */
function getActiveCats(){
  if(currentMode === 'libre') return libereCat ? [libereCat] : [];
  if(currentMode === 'classique') return classiqueCat ? [classiqueCat] : [];
  if(currentMode === 'multi') return multiCats;
  return [];
}

/* ========== RECHERCHE ========== */
document.getElementById('search-input').addEventListener('input', e => {
  renderResults(e.target.value.trim());
});

function renderResults(query){
  const el = document.getElementById('results');
  el.innerHTML = '';

  const activeCats = getActiveCats();

  if(activeCats.length === 0){
    let hint = '';
    if(currentMode === 'libre') hint = 'Choisis une catégorie pour commencer';
    else if(currentMode === 'classique') hint = 'Tire une catégorie pour commencer';
    else hint = 'Tire les catégories pour commencer';
    el.innerHTML = `<div class="no-cat-hint">${hint}</div>`;
    return;
  }

  if(query.length < 1) return;

  const q = normalize(query);
  const matches = COUNTRIES.filter(c => normalize(c.name).includes(q)).slice(0, 8);

  if(matches.length === 0){
    el.innerHTML = `<div class="no-result">Aucun pays trouvé pour « ${query} »</div>`;
    return;
  }

  matches.forEach(c => {
    const card = document.createElement('div');
    card.className = 'result-card';

    if(activeCats.length === 1){
      const cat = activeCats[0];
      card.innerHTML = `
        <div class="result-flag">${flag(c.iso)}</div>
        <div class="result-body">
          <div class="result-name">${c.name}</div>
          <div class="result-cat">${cat.icon} ${cat.label}</div>
        </div>
        <div class="result-value">${show(cat, c[cat.key])}</div>
      `;
    } else {
      // Mode multi : afficher toutes les catégories actives
      const rowsHtml = activeCats.map(cat =>
        `<div class="result-multi-row">
          <span class="result-multi-label">${cat.icon} ${cat.label}</span>
          <span class="result-multi-val">${show(cat, c[cat.key])}</span>
        </div>`
      ).join('');
      card.innerHTML = `
        <div class="result-flag">${flag(c.iso)}</div>
        <div class="result-body" style="width:100%">
          <div class="result-name">${c.name}</div>
          <div class="result-multi">${rowsHtml}</div>
        </div>
      `;
    }

    card.addEventListener('click', () => openModal(c));
    el.appendChild(card);
  });
}

/* ========== MODAL détail ========== */
function openModal(country){
  document.getElementById('m-flag').textContent = flag(country.iso);
  document.getElementById('m-name').textContent = country.name;

  const activeCats = getActiveCats();
  const activeKeys = new Set(activeCats.map(c => c.key));

  const rows = document.getElementById('m-rows');
  rows.innerHTML = '';

  CATEGORIES.forEach(cat => {
    const isActive = activeKeys.has(cat.key);
    const row = document.createElement('div');
    row.className = 'modal-row';
    row.innerHTML = `
      <div class="modal-row-label">${cat.icon} ${cat.label}${isActive ? `<div class="src-line">${srcHTML(cat)}</div>` : ""}</div>
      <div class="modal-row-value${isActive ? " highlight" : ""}">${show(cat, country[cat.key])}</div>
    `;
    rows.appendChild(row);
  });

  document.getElementById('modal').classList.add('open');
}

function closeModal(e){
  if(e.target === document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
}

/* ========== INIT ========== */
changeRounds(0);
buildCatGrid();
updateClassiqueUI();
updateMultiUI();
changeMultiX(0); // initialise les boutons ±
</script>
